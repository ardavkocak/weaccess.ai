{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><i class="bi bi-exclamation-triangle me-2"></i>{{ title }}</div>
            <div class="card-body">
                <p>
                    <strong>{{ object }}</strong> kaydini silmek istediginizden emin misiniz?
                    Bu islem geri alinamaz.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Evet, Sil</button>
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Vazgec</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
