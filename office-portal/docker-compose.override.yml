# Ortama ozgu degerler. zimmet-sistemi/docker-compose.override.yml ile ayni
# desen izlenir. Gercek uretim sırlarını burada tutmayin; gelistirme icin
# placeholder degerlerdir.

services:
  db:
    environment:
      POSTGRES_DB: office_portal_db
      POSTGRES_USER: office_portal_user
      POSTGRES_PASSWORD: "office_portal_pass"

  web:
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-office-portal-degistir-bu-anahtari"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      TIME_ZONE: "Europe/Istanbul"

      DB_NAME: office_portal_db
      DB_USER: office_portal_user
      DB_PASSWORD: "office_portal_pass"

      EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: "Ofis Portali <noreply@ofisportali.local>"

      # discord-bot container'ini docker socket uzerinden (yeniden) olustururken
      # kullanilacak, HOST'un gordugu mutlak yol. Makineye ozgu, bu yuzden
      # override dosyasindadir.
      DISCORD_BOT_HOST_PATH: "c:\\Users\\ARDA\\Desktop\\Github Repos\\weaccess.ai\\discord-bot"

    # Port eslemesi yalnizca burada tanimlidir. 8000 doluysa sol tarafi
    # degistirin (zimmet-sistemi zaten 8001'i kullaniyor).
    ports:
      - "8000:8000"
