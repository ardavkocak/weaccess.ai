# Ofis Portali - Docker Compose yapilandirmasi
#
# BU DOSYA GIT'E GIRER. Hicbir gizli deger icermez; yalnizca yapiyi tanimlar.
# Degerler docker-compose.override.yml icindedir (.gitignore'da).
#
# Ilk kurulumda:  cp docker-compose.override.yml.example docker-compose.override.yml
name: office-portal
services:
  db:
    image: postgres:16-alpine
    container_name: c_office-portal-db
    volumes:
      - office_portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c_office-portal-web
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # ofis-gorev-takibi'nin SQLite dosyasi asagidaki volume ile ayni yola
      # baglanir; router.py bu yolu okur (bkz. apps/office_bot/router.py).
      # Dosya adi ofis-gorev-takibi/docker-compose.yml'deki DATABASE_FILE
      # degeriyle (office-task-tracking.sqlite) birebir ayni olmalidir.
      OFFICE_BOT_DB_PATH: /ofis-gorev-takibi-data/office-task-tracking.sqlite
      # discord-bot container'ini docker SDK ile (yeniden) olustururken volume
      # kaynak yollari HOST'un gordugu mutlak yol olmali (bu container'in kendi
      # /discord-bot-src goruntusu degil) - bkz. apps/discordbot/docker_control.py.
      # Gercek deger docker-compose.override.yml'de (makineye ozgu, .gitignore'da).
      DISCORD_BOT_HOST_PATH: ""
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      # ofis-gorev-takibi konteynerinin yazdigi ayni host klasoru: iki proje
      # ayni SQLite dosyasini paylasir (bkz. ofis-gorev-takibi/docker-compose.yml
      # -> ./ofis-data:/app/data).
      - ../ofis-gorev-takibi/ofis-data:/ofis-gorev-takibi-data
      # discord-bot: ayarlar sayfasi .env/credentials.json dosyalarini buraya yazar.
      - ../discord-bot:/discord-bot-src
      # Docker socket: discord-bot modulunun Baslat/Durdur kontrolu icin.
      # DIKKAT: bu, office-portal container'ina host'taki TUM Docker
      # container'lari uzerinde kontrol yetkisi verir (yalniz discord-bot
      # degil) - kullanicinin acik onayiyla eklenmistir (bkz. proje notlari).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  office_portal_postgres_data:
