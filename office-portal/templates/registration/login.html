{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Ofis Portalı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="mb-2" style="font-size: 2rem;"><i class="bi bi-grid-3x3-gap-fill"></i></div>
                <h4 class="mb-0">Ofis Portalı</h4>
                <div class="small opacity-75">Kurumsal Yönetim Merkezi</div>
            </div>
            <div class="auth-body">
                {% if form.errors %}
                <div class="alert alert-danger">
                    {% for error in form.non_field_errors %}{{ error }}{% endfor %}
                </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">E-posta</label>
                        <input type="email" name="username" id="id_username" class="form-control"
                               autofocus required autocomplete="email" placeholder="ornek@sirket.com">
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Şifre</label>
                        <div class="input-group">
                            <input type="password" name="password" id="id_password" class="form-control" required placeholder="şifreniz">
                            <button class="btn btn-outline-secondary" type="button" data-toggle-password="id_password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="remember_me" id="id_remember_me" class="form-check-input">
                        <label for="id_remember_me" class="form-check-label">Beni Hatırla</label>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100 mb-3">Giriş Yap</button>
                    <div class="text-center">
                        <a href="{% url 'accounts:password_reset' %}" class="small text-decoration-none">Şifremi unuttum</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
